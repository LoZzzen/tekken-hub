<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tekken Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: menu principal façon Tekken 8. Titre + onglets fins en haut, liste verticale à gauche, contenu au centre, cartes de chaînes à droite, icônes et aide en bas. */
:root {
  --bg: #070a12;
  --bg-2: #141a33;
  --panel: rgba(12, 16, 30, .72);
  --panel-solid: #0f1424;
  --line: rgba(255, 255, 255, .14);
  --fg: #f1f3f9;
  --mute: #98a1b8;
  --dim: #5d667e;
  --red: #e0213f;
  --red-2: #8c1630;
  --cyan: #6fd6ff;
  --amber: #ffb224;
  --ok: #3ddc97;
  --ui: "Barlow", "Segoe UI", system-ui, sans-serif;
  --display: "Oxanium", "Arial Narrow", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background:
    radial-gradient(ellipse 60% 70% at 62% 38%, rgba(111, 118, 214, .30), transparent 70%),
    radial-gradient(ellipse 40% 50% at 12% 100%, rgba(224, 33, 63, .16), transparent 70%),
    linear-gradient(160deg, var(--bg-2), var(--bg) 60%);
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100vh;
  padding-block: 18px 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 14px; }

/* Titre + onglets */
.title { font-family: var(--ui); font-weight: 600; font-size: 28px; letter-spacing: .01em; margin: 4px 0 0; }
.navrow { display: flex; align-items: center; gap: 10px; }
.cap { flex: none; min-width: 30px; height: 22px; padding: 0 7px; display: inline-grid; place-items: center; background: #e9ecf4; color: #0b0e18; font-family: var(--mono); font-weight: 700; font-size: 11px; border-radius: 4px; border: 0; }
.tabs-scroll { overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.tabs { display: flex; align-items: stretch; min-width: max-content; }
.tab { background: none; border: 0; padding: 8px 22px 10px; font-size: 16px; font-weight: 500; color: var(--fg); position: relative; white-space: nowrap; }
.tab + .tab::before { content: ""; position: absolute; left: 0; top: 30%; bottom: 30%; width: 1px; background: var(--line); }
.tab:hover { color: #fff; }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; background: var(--red); box-shadow: 0 0 12px 1px rgba(224, 33, 63, .8); }
.tab .ico { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; }

/* Zone principale */
.main { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 22px; min-height: 480px; align-items: start; }
.list { display: grid; gap: 2px; align-content: start; max-height: 62vh; overflow-y: auto; padding-right: 2px; scrollbar-width: thin; scrollbar-color: var(--dim) transparent; }
.item { text-align: left; background: none; border: 0; padding: 7px 12px; font-size: 16px; font-weight: 500; color: var(--fg); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.item:hover { background: rgba(255, 255, 255, .06); }
.item[aria-current="true"] { background: linear-gradient(90deg, var(--red), var(--red-2)); font-weight: 600; box-shadow: 0 4px 16px rgba(224, 33, 63, .28); }
.item .star { color: var(--amber); font-size: 13px; }
.item .sm { font-family: var(--mono); font-size: 11px; color: var(--mute); }
.item[aria-current="true"] .sm { color: #ffd6de; }

.center { min-width: 0; display: grid; gap: 16px; align-content: start; }
.hero { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 7vw, 92px); line-height: .92; letter-spacing: .02em; text-transform: uppercase; color: rgba(255, 255, 255, .08); margin: 6px 0 0; user-select: none; }
.hero b { color: rgba(224, 33, 63, .35); }
h2 { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 4vw, 40px); text-transform: uppercase; letter-spacing: .02em; margin: 0; line-height: 1; text-wrap: balance; }
.kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
.lead { color: var(--mute); max-width: 60ch; margin: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 16px; backdrop-filter: blur(6px); }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin: 0 0 8px; }

/* Cartes à droite */
.side { display: grid; gap: 12px; align-content: start; }
.tile { display: grid; gap: 6px; padding: 12px 14px; text-decoration: none; border: 1px solid var(--line); background: var(--panel); position: relative; overflow: hidden; }
.tile:hover { border-color: var(--cyan); }
.tile .t { font-weight: 600; font-size: 15px; }
.tile .d { color: var(--mute); font-size: 13px; }
.tile.purple { background: linear-gradient(120deg, rgba(120, 70, 220, .55), rgba(30, 20, 70, .8)); }
.tile.crimson { background: linear-gradient(120deg, rgba(224, 33, 63, .5), rgba(50, 10, 25, .85)); }
.tile .go { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); }
.logo { display: grid; place-items: center; height: 96px; border: 1px solid var(--line); background: linear-gradient(135deg, #1b2030, #0b0e18); }
.logo span { font-family: var(--display); font-weight: 800; font-size: 28px; font-style: italic; letter-spacing: .04em; }
.logo b { color: var(--red); }

/* Notation */
.seq { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.key { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; padding: 0 8px; font-family: var(--mono); font-weight: 700; font-size: 14px; background: #1a2036; border: 1px solid var(--line); border-bottom: 3px solid var(--cyan); border-radius: 3px; color: var(--cyan); }
.key.atk { border-bottom-color: var(--red); color: #fff; }
.sep { color: var(--mute); font-family: var(--mono); padding: 0 1px; }

/* Combos / replays */
.vid { display: grid; gap: 10px; }
.thumb { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 9; max-width: 100%; text-decoration: none; background: linear-gradient(135deg, #1c2442, #0c1020 70%); border: 1px solid var(--line); overflow: hidden; }
.thumb::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, transparent 0 22px, rgba(255, 255, 255, .03) 22px 23px); }
.thumb .play { width: 58px; height: 58px; border-radius: 50%; background: var(--red); display: grid; place-items: center; box-shadow: 0 0 24px rgba(224, 33, 63, .6); position: relative; }
.thumb .play::after { content: ""; border-left: 16px solid #fff; border-top: 10px solid transparent; border-bottom: 10px solid transparent; margin-left: 4px; }
.thumb .src { position: absolute; left: 10px; bottom: 8px; font-family: var(--mono); font-size: 11px; color: var(--mute); letter-spacing: .06em; }
.thumb:hover { border-color: var(--cyan); }
.thumb .facade { position: absolute; inset: 0; border: 0; padding: 0; background: none; display: grid; place-items: center; }
.thumb .facade img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.thumb.ph .src { position: relative; left: auto; bottom: auto; text-align: center; padding: 0 16px; font-size: 12px; }
.entry { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--red); }
.entry h3 { margin: 0; font-size: 18px; font-weight: 600; }
.entry p { margin: 0; color: var(--mute); font-size: 14px; }
.entry .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { background: var(--red); border: 0; color: #fff; padding: 9px 18px; font-weight: 600; letter-spacing: .03em; text-decoration: none; display: inline-block; font-size: 14px; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.sm { padding: 5px 12px; font-size: 12px; }
.btn:hover { filter: brightness(1.12); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
form.add { display: grid; gap: 10px; }
form.add label { display: grid; gap: 4px; font-size: 13px; color: var(--mute); }
form.add input { background: rgba(255, 255, 255, .06); border: 1px solid var(--line); padding: 9px 10px; color: var(--fg); width: 100%; }
form.add input::placeholder { color: var(--dim); }
details > summary { cursor: pointer; font-weight: 600; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; color: var(--red); font-family: var(--mono); }
details[open] > summary::before { content: "– "; }
.err { color: #ff8095; font-size: 13px; min-height: 1em; }

/* Stats */
.bar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 26px; gap: 10px; align-items: center; margin: 9px 0; font-size: 14px; }
.track { height: 8px; background: rgba(255, 255, 255, .1); }
.fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--amber)); }
.v { font-family: var(--mono); font-size: 13px; text-align: right; }
.note { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: .03em; }

/* Perso / custo */
.stage { background: radial-gradient(ellipse at 50% 90%, rgba(224, 33, 63, .28), transparent 62%), var(--panel); border: 1px solid var(--line); display: grid; place-items: center; padding: 10px; }
.stage svg { width: 100%; max-width: 300px; height: auto; display: block; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; }
.sw { height: 40px; border: 2px solid var(--line); background: none; padding: 0; position: relative; }
.sw span { position: absolute; inset: 2px; }
.sw[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--red); }

/* Visionneuse 3D */
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.vwrap { min-width: 0; }
.viewer { position: relative; height: min(66vh, 580px); min-height: 380px; background: radial-gradient(ellipse at 50% 88%, rgba(224, 33, 63, .28), transparent 62%), var(--panel); border: 1px solid var(--line); overflow: hidden; }
.viewer canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.viewer canvas:active { cursor: grabbing; }
.vcap { position: absolute; left: 12px; right: 12px; bottom: 8px; font-family: var(--mono); font-size: 11px; color: var(--mute); pointer-events: none; }
.viewer-msg { padding: 24px; color: var(--mute); margin: 0; }
.stack { display: grid; gap: 14px; min-width: 0; align-content: start; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: transparent; border: 1px solid var(--line); padding: 6px 14px; font-size: 14px; color: var(--mute); }
.chip:hover { color: var(--fg); border-color: var(--mute); }
.chip[aria-pressed="true"] { border-color: var(--red); color: #fff; background: rgba(224, 33, 63, .22); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; }
.sw { height: 40px; border: 2px solid var(--line); background: none; padding: 0; position: relative; }
.sw span { position: absolute; inset: 2px; }
.sw[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--red); }

/* Bas d'écran */
.bottom { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-end; padding-top: 6px; }
.icons { display: flex; gap: 20px; flex-wrap: wrap; }
.icon { display: grid; justify-items: center; gap: 6px; background: none; border: 0; text-decoration: none; font-size: 12px; font-weight: 600; width: 74px; color: var(--fg); }
.icon svg { width: 32px; height: 32px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon:hover { color: var(--cyan); }
.hint { flex: 1 1 100%; color: var(--cyan); font-size: 14px; border-bottom: 1px solid rgba(111, 214, 255, .35); padding-bottom: 5px; min-height: 1.6em; }
.prompts { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--mute); width: 100%; }
.prompts button { background: none; border: 0; padding: 0; display: inline-flex; gap: 7px; align-items: center; color: var(--mute); font-size: 13px; }
.prompts button:hover { color: var(--fg); }
.btnc { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid var(--mute); font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 0 4px; }
.foot { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.restore { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 5; }
body.hide-ui .wrap { visibility: hidden; }

@media (max-width: 980px) {
  .main, .split { grid-template-columns: minmax(0, 1fr); }
  .viewer { height: 62vh; min-height: 340px; }
  .list { max-height: 220px; grid-auto-flow: row; }
  .title { font-size: 24px; }
  .tab { padding: 8px 14px 10px; }
}
@media (prefers-reduced-motion: no-preference) {
  .center > * { animation: in .25s ease-out both; }
  @keyframes in { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<div class="wrap" id="app">
  <h1 class="title" id="title">Menu principal</h1>
  <div class="navrow">
    <button class="cap" id="prev" aria-label="Onglet précédent">L1</button>
    <div class="tabs-scroll"><div class="tabs" id="tabs" role="tablist" aria-label="Sections"></div></div>
    <button class="cap" id="next" aria-label="Onglet suivant">R1</button>
  </div>

  <div class="main">
    <div class="list" id="list" role="listbox" aria-label="Liste"></div>
    <div class="center" id="center" aria-live="polite"></div>
  </div>

  <div class="bottom">
    <div class="icons" id="icons"></div>
    <div class="hint" id="hint"></div>
    <div class="prompts">
      <button id="b-ok"><span class="btnc">↵</span>Valider</button>
      <button id="b-fav"><span class="btnc">F</span>Favori</button>
      <button id="b-tab"><span class="btnc">Q</span><span class="btnc">E</span>Changer d'onglet</button>
      <button id="b-hide"><span class="btnc">H</span>Masquer l'interface</button>
    </div>
    <div class="foot">Site de fans. Vidéos de combos : RyzingSol. Replays : Tekken8Replays. Tekken est une marque de Bandai Namco. Les personnages 3D affichés sont des mannequins génériques.</div>
  </div>
</div>
<button class="btn restore" id="restore" hidden>Afficher l'interface</button>

<script>
(function () {
  /* ---------- Utilitaires ---------- */
  var $ = function (s) { return document.querySelector(s); };
  function h(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function add(parent) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]); return parent; }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  function ytOk(u) { try { var x = new URL(u); return x.protocol === 'https:' && ['www.youtube.com', 'youtube.com', 'm.youtube.com', 'youtu.be'].indexOf(x.hostname) >= 0; } catch (e) { return false; } }
  /* EMBED = true sur un vrai site (GitHub Pages, etc.) : les vidéos se lisent dans la page, sans jamais renvoyer vers YouTube. */
  var EMBED = true;
  /* Vidéos récupérées par scripts/update_videos.py (data/videos.json) */
  var vids = { combos: [], replays: [] };
  function vidUrl(v) { return 'https://www.youtube.com/watch?v=' + v.id; }
  function ytId(u) { try { var x = new URL(u); var id = x.hostname === 'youtu.be' ? x.pathname.slice(1) : (x.searchParams.get('v') || ''); return /^[\w-]{11}$/.test(id) ? id : ''; } catch (e) { return ''; } }

  function keyRow(str) {
    var row = h('div', 'seq');
    String(str).split(',').forEach(function (step, i) {
      if (i) add(row, h('span', 'sep', '›'));
      step.trim().split('+').forEach(function (k, j) {
        k = k.trim(); if (!k) return;
        if (j) add(row, h('span', 'sep', '+'));
        add(row, h('span', 'key' + (/^[1-4]$/.test(k) ? ' atk' : ''), k));
      });
    });
    return row;
  }
  function thumb(url, label) {
    var vid = EMBED ? ytId(url) : '';
    if (vid) {
      var box = h('div', 'thumb');
      var fr = document.createElement('iframe');
      fr.src = 'https://www.youtube-nocookie.com/embed/' + vid;
      fr.title = label; fr.loading = 'lazy'; fr.allowFullscreen = true;
      fr.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
      fr.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      box.appendChild(fr); return box;
    }
    var ph = h('div', 'thumb ph');
    add(ph, h('span', 'src', EMBED ? 'Vidéo à venir pour ce combo' : 'Le lecteur vidéo s\'active sur la version hébergée du site'));
    return ph;
  }

  /* ---------- Données ---------- */
  var fighters = [
    ['Jin', 'Karaté Mishima', [8, 9, 6, 6, 9]], ['Kazuya', 'Karaté Mishima', [9, 8, 6, 6, 9]],
    ['Paul', 'Judo', [10, 5, 6, 7, 5]], ['King', 'Catch', [8, 5, 5, 6, 9]],
    ['Law', 'Kung-fu', [6, 9, 6, 5, 7]], ['Jun', 'Aïkido', [6, 7, 6, 7, 7]],
    ['Reina', 'Mishima', [8, 8, 6, 6, 8]], ['Lars', 'Alliance', [6, 9, 6, 6, 7]],
    ['Asuka', 'Kazama', [6, 7, 5, 8, 8]], ['Lili', 'Acrobate', [5, 9, 7, 5, 8]],
    ['Nina', 'Assassin', [7, 7, 5, 7, 8]], ['Hwoarang', 'Taekwondo', [7, 9, 7, 5, 9]],
    ['Xiaoyu', 'Piqua', [5, 9, 5, 6, 9]], ['Jack-8', 'Cyborg', [9, 4, 6, 8, 4]],
    ['Bryan', 'Kickboxing', [8, 7, 7, 6, 9]], ['Yoshimitsu', 'Sabre', [6, 8, 5, 6, 10]],
    ['Leroy', 'Maître de kung-fu', [7, 7, 7, 7, 8]], ['Zafina', 'Mystique', [6, 8, 6, 5, 9]],
    ['Steve', 'Boxe', [6, 8, 5, 7, 6]], ['Dragunov', 'Sambo', [8, 6, 6, 7, 6]],
    ['Azucena', 'Capoeira', [6, 8, 6, 6, 8]], ['Victor', 'Escrime', [7, 7, 8, 6, 7]]
  ];
  var statNames = ['Puissance', 'Vitesse', 'Portée', 'Défense', 'Difficulté'];
  var seedCombos = {
    'Jin': [{ title: 'Combos de mur (9 enchaînements)', url: 'https://www.youtube.com/watch?v=03K8xEXeLww', keys: '', note: 'Vidéo de RyzingSol. Les touches sont affichées dans la vidéo : à saisir ici une fois relevées.' }, { title: 'Wavedash', keys: 'f, n, d, d/f', note: 'Déplacement qui coupe la distance. Base du jeu des Mishima.' }, { title: 'Electric Wind God Fist', keys: 'f, n, d, d/f+2', note: 'Coup signature des Mishima, exigeant à exécuter.' }],
    'Kazuya': [{ title: 'Wavedash', keys: 'f, n, d, d/f', note: 'Déplacement qui coupe la distance. Base du jeu des Mishima.' }, { title: 'Electric Wind God Fist', keys: 'f, n, d, d/f+2', note: 'Coup signature des Mishima, exigeant à exécuter.' }]
  };
  var news = [
    ['Patch', 'Notes de patch : équilibrage', 'Le résumé des changements de chaque mise à jour, personnage par personnage.'],
    ['Nouveau personnage', 'Un combattant rejoint le roster', 'Présentation du style, des coups signatures et d\'un premier guide.'],
    ['Événement', 'Calendrier des tournois', 'Dates, lieux et formats des compétitions à suivre.'],
    ['Communauté', 'Clips de la semaine', 'Une sélection de combos et de retournements envoyés par les joueurs.']
  ];
  var seedReplays = [
    { title: 'Finale de tournoi', who: 'Joueur A (Jin) contre Joueur B (Paul)', score: '3 – 1', example: true },
    { title: 'Demi-finale', who: 'Joueur C (Law) contre Joueur D (Bryan)', score: '2 – 3', example: true },
    { title: 'Quart de finale', who: 'Joueur E (Reina) contre Joueur F (Lars)', score: '3 – 0', example: true }
  ];
  /* Pièces génériques (aucun objet officiel du jeu) : [slot, nom, [[id, nom], ...]] */
  var slotsDef = [
    ['jacket', 'Haut', [['basic', 'Veste'], ['long', 'Manteau long'], ['sleeveless', 'Débardeur']]],

    ['gloves', 'Mains', [['boxing', 'Gants de boxe'], ['wraps', 'Bandages'], ['none', 'Aucun']]],

  function chip(parent, label, on, fn) {
    var b = h('button', 'chip', label); b.type = 'button'; b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.addEventListener('click', fn); add(parent, b);
  }
  function centerCusto() {
    var f = currentFighter(), c = $('#center'), look = getLook(f[0]);
    add(c, h('div', 'kicker', 'Personnalisation'), h('h2', '', f[0]));
    var split = h('div', 'split'), left = h('div', 'vwrap'), right = h('div', 'stack');
    mountViewer(left);
    function refresh() { store('th-looks', state.looks); showModel(f, look); draw(); }
    function draw() {
      right.innerHTML = '';
      var def = slotsDef.filter(function (x) { return x[0] === state.slot; })[0];
      var p = h('div', 'panel');
      add(p, h('p', 'label', 'Pièce'));
      var row = h('div', 'chips');
      slotsDef.forEach(function (s) { chip(row, s[1], state.slot === s[0], function () { state.slot = s[0]; draw(); }); });
      add(p, row);
      if (def[2].length > 1) {
        var l2 = h('p', 'label', 'Modèle'); l2.style.marginTop = '16px'; add(p, l2);
        var r2 = h('div', 'chips');
        def[2].forEach(function (it) { chip(r2, it[1], look.items[def[0]] === it[0], function () { look.items[def[0]] = it[0]; refresh(); }); });
        add(p, r2);
      }
      var l3 = h('p', 'label', 'Couleur'); l3.style.marginTop = '16px'; add(p, l3);
      var grid = h('div', 'swatches');
      palette.forEach(function (col) {
        var b = h('button', 'sw'); b.type = 'button'; b.setAttribute('aria-label', 'Couleur ' + col);
        b.setAttribute('aria-pressed', look.colors[def[0]] === col ? 'true' : 'false');
        var sp = h('span'); sp.style.background = col; add(b, sp);
        b.addEventListener('click', function () { look.colors[def[0]] = col; refresh(); });
        add(grid, b);
      });
      add(p, grid);
      var act = h('div', 'row'); act.style.marginTop = '16px';
      var rnd = h('button', 'btn', 'Aléatoire'), rst = h('button', 'btn ghost', 'Réinitialiser');
      rnd.addEventListener('click', function () {
        slotsDef.forEach(function (s) {
          look.colors[s[0]] = palette[Math.floor(Math.random() * palette.length)];
          look.items[s[0]] = s[2][Math.floor(Math.random() * s[2].length)][0];
        });
        refresh();
      });
      rst.addEventListener('click', function () { look.colors = clone(defaults); look.items = clone(defItems); refresh(); });
      add(act, rnd, rst); add(p, act);
      add(right, p, h('p', 'note', 'Pièces génériques en attendant les objets du jeu. Ton look est enregistré dans ce navigateur.'));
    }
    showModel(f, look); draw();
    add(split, left, right); add(c, split);
  }

  function render() {
    renderTabs(); renderList();
    var c = $('#center'); c.innerHTML = '';
    var t = state.tab;
    if (t === 'home') centerHome(); else if (t === 'combos') centerCombos(); else if (t === 'persos') centerPersos();
    else if (t === 'actus') centerActus(); else if (t === 'pro') centerPro(); else centerCusto();
    var cur = tabs.filter(function (x) { return x.id === t; })[0];
    $('#title').textContent = t === 'home' ? 'Menu principal' : cur.label;
  }
  function go(tab, fighterName) {
    state.tab = tab;
    if (fighterName) { var i = items().map(function (x) { return x.label; }).indexOf(fighterName); if (i >= 0) state.sel[tab] = i; }
    try { history.replaceState(null, '', '#' + tab); } catch (e) {}
    render();
  }
  function step(d) { var i = tabs.map(function (t) { return t.id; }).indexOf(state.tab); go(tabs[(i + d + tabs.length) % tabs.length].id); }
  function move(d) { var n = items().length; state.sel[state.tab] = (state.sel[state.tab] + d + n) % n; render(); }
  function fav() {
    if (state.tab !== 'combos' && state.tab !== 'persos' && state.tab !== 'custo') return;
    var name = items()[state.sel[state.tab]].label, i = state.favs.indexOf(name);
    if (i >= 0) state.favs.splice(i, 1); else state.favs.push(name);
    store('th-favs', state.favs);
    state.sel[state.tab] = items().map(function (x) { return x.label; }).indexOf(name);
    render();
  }
  function hideUi(on) { document.body.classList.toggle('hide-ui', on); $('#restore').hidden = !on; }

  /* ---------- Bas d'écran ---------- */
  var ic = {
    play: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12"/><path d="M13 11l8 5-8 5z"/></svg>',
    news: '<svg viewBox="0 0 32 32"><rect x="5" y="6" width="22" height="20" rx="2"/><path d="M10 12h12M10 17h12M10 22h7"/></svg>',
    palette: '<svg viewBox="0 0 32 32"><path d="M16 5a11 11 0 1 0 0 22c2 0 3-1 3-2.500 0-2-2-2-2-4s1.500-3 3.500-3H25a3 3 0 0 0 3-3C28 9 22.500 5 16 5z"/><circle cx="10.500" cy="14" r="1.200"/><circle cx="15" cy="10" r="1.200"/><circle cx="21" cy="11" r="1.200"/></svg>',
    users: '<svg viewBox="0 0 32 32"><circle cx="16" cy="12" r="4.500"/><path d="M7 26c1-5 4-8 9-8s8 3 9 8"/></svg>'
  };
  [['Combos', ic.play, 'tab', 'combos'], ['Replays', ic.play, 'tab', 'pro'], ['Personnages', ic.users, 'tab', 'persos'], ['Actus', ic.news, 'tab', 'actus'], ['Custo', ic.palette, 'tab', 'custo']].forEach(function (x) {
    var e = h('button', 'icon'); e.type = 'button'; e.addEventListener('click', function () { go(x[3]); });
    e.innerHTML = x[1] + '<span>' + x[0] + '</span>';
    $('#icons').appendChild(e);
  });

  $('#prev').addEventListener('click', function () { step(-1); });
  $('#next').addEventListener('click', function () { step(1); });
  $('#b-ok').addEventListener('click', function () { if (state.tab === 'home') go(homeItems[state.sel.home][1]); else if (state.tab === 'persos') go('combos', items()[state.sel.persos].label); });
  $('#b-fav').addEventListener('click', fav);
  $('#b-tab').addEventListener('click', function () { step(1); });
  $('#b-hide').addEventListener('click', function () { hideUi(true); });
  $('#restore').addEventListener('click', function () { hideUi(false); });
  document.addEventListener('keydown', function (ev) {
    var t = ev.target && ev.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (document.body.classList.contains('hide-ui')) { hideUi(false); return; }
    var k = ev.key;
    if (k === 'ArrowDown') { ev.preventDefault(); move(1); }
    else if (k === 'ArrowUp') { ev.preventDefault(); move(-1); }
    else if (k === 'q' || k === 'Q') step(-1);
    else if (k === 'e' || k === 'E') step(1);
    else if (k === 'f' || k === 'F') fav();
    else if (k === 'h' || k === 'H') hideUi(true);
    else if (k === 'Enter' && t !== 'BUTTON' && t !== 'A') $('#b-ok').click();
  });

  var start = (location.hash || '').replace('#', '');
  state.tab = tabs.some(function (x) { return x.id === start; }) ? start : 'home';
  render();
  try {
    /* data/models.json : { "Jin": "models/jin.glb", ... } (modèles 3D autorisés que tu ajoutes) */
    fetch('data/models.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (d && typeof d === 'object') { models = d; render(); }
    }).catch(function () {});
    fetch('data/videos.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (d && d.combos && d.replays) { vids = d; render(); }
    }).catch(function () {});
  } catch (e) {}
})();
</script>
</html>
