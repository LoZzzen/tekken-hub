name: Mise à jour des vidéos
on:
  schedule:
    - cron: "0 5 * * *"   # tous les jours à 5h UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yt-dlp
      - run: python scripts/update_videos.py
      - name: Commit si changement
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/videos.json data/desc.json
          git diff --cached --quiet || (git commit -m "Mise à jour des vidéos" && git push)
